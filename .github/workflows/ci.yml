name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            torch-spec: "torch==2.9.*"
          - python-version: "3.12"
            torch-spec: "torch>=2.9"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: "pyproject.toml"
      - name: Install CPU torch, dev tools, and the package
        run: |
          uv venv --clear
          uv pip install --python .venv/bin/python \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            "${{ matrix.torch-spec }}" setuptools pytest mypy ruff
          uv pip install --python .venv/bin/python -e . --no-deps
      - name: Lint and type-check
        run: |
          uv run --no-sync ruff check src tests benchmarks examples
          uv run --no-sync mypy src/echelon
      - name: Run tests
        run: uv run --no-sync pytest -q
      - name: Run the example
        run: uv run --no-sync python examples/train_toy.py
